name: Finalize verified formatter

on:
  push:
    paths:
      - .github/workflows/finalize-selftest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .selftest-upload/index.html.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > index.html
          echo "ed10970c96c7a42575a75c93e231b60199fb97c7f07a6ba750e2c4bc509bdd9d  index.html" \
            | sha256sum --check --strict
          rm -rf .selftest-upload
          rm -f .github/workflows/finalize-selftest.yml

      - name: Commit verified formatter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: verify formatter with one-line self-test"
          git push origin HEAD:main
