name: Finalize formatter upload

on:
  push:
    paths:
      - .github/workflows/finalize-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .upload-parts/index.html.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > index.html
          echo "822f601ca4e1063c06ca8abc9af26cac405011b5096f81d6ada2ea22a1385a2f  index.html" \
            | sha256sum --check --strict
          rm -rf .upload-parts
          rm -f .github/workflows/finalize-upload.yml

      - name: Commit formatter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add standalone HTML formatter"
          git push origin HEAD:main
