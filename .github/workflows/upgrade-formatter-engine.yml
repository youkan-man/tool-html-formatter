name: Upgrade formatter engine

on:
  push:
    paths:
      - .github/workflows/upgrade-formatter-engine.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore staged upgrade scripts
        shell: bash
        run: |
          set -euo pipefail
          for name in rebuild.js minify.js browser-test.js; do
            base64 --decode ".upgrade/${name}.gz.b64" | gzip --decompress > ".upgrade/${name}"
          done
          cat > /tmp/upgrade-sha256.txt <<'EOF'
          1b72d72d9001ad308466392f71460d366c266812530148ea17591452217cc266  .upgrade/rebuild.js
          a4047bed8df5caabfa0721d9a3ac180c267f2ca43ea126c1825d5467156f19d2  .upgrade/minify.js
          4f16b71c55cda693902e6df498fcb3c3b5244a4836d5678e5ba0a80ec3cd358a  .upgrade/browser-test.js
          EOF
          sha256sum --check --strict /tmp/upgrade-sha256.txt
          node --check .upgrade/rebuild.js
          node --check .upgrade/minify.js
          node --check .upgrade/browser-test.js

      - name: Install formatter and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save \
            prettier@3.9.6 \
            js-beautify@2.0.3 \
            html-minifier-terser@7.2.0 \
            playwright@1.55.0

      - name: Rebuild the single-file application
        shell: bash
        run: node .upgrade/rebuild.js

      - name: Create and verify a one-line application
        shell: bash
        run: node .upgrade/minify.js

      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Run browser integration and self-format tests
        shell: bash
        run: node .upgrade/browser-test.js

      - name: Commit the verified formatter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upgrade node_modules package.json package-lock.json
          rm -f .github/workflows/upgrade-formatter-engine.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: upgrade to parser-based formatter with worker fallback"
          git push origin HEAD:main
