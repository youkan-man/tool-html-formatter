name: Upgrade formatter engine

on:
  push:
    paths:
      - .github/workflows/upgrade-formatter-engine.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install formatter and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save \
            prettier@3.9.6 \
            js-beautify@2.0.3 \
            html-minifier-terser@7.2.0 \
            playwright@1.55.0

      - name: Rebuild the single-file application
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const htmlPath = "index.html";
          const source = fs.readFileSync(htmlPath, "utf8");
          const engineMarker = "    <script>\n/*!\n * Embedded js-beautify 2.0.3";
          const engineStart = source.indexOf(engineMarker);
          const uiMarker = [
            "      (() => {",
            "        \"use strict\";",
            "        if (!window.HtmlFormatterCore) {",
          ].join("\n");
          const uiStart = source.indexOf(uiMarker, engineStart);
          const uiScriptEnd = source.indexOf("    </script>", uiStart);

          if (engineStart < 0 || uiStart < 0 || uiScriptEnd < 0) {
            throw new Error("Could not locate the current formatter engine and UI script.");
          }

          function replaceOnce(value, search, replacement, label) {
            const index = value.indexOf(search);
            if (index < 0) {
              throw new Error(`Could not replace ${label}.`);
            }
            if (value.indexOf(search, index + search.length) >= 0) {
              throw new Error(`Replacement target for ${label} is not unique.`);
            }
            return value.slice(0, index) + replacement + value.slice(index + search.length);
          }

          let prefix = source.slice(0, engineStart);
          const suffix = source.slice(uiScriptEnd + "    </script>".length);

          prefix = replaceOnce(
            prefix,
            "HTMLと組み込みCSS・JavaScriptをブラウザ内だけで整形する単一ファイルのフォーマッター",
            "HTML・Vue・Angularと組み込みCSS・JavaScript・TypeScript・JSONをブラウザ内だけで解析整形する単一ファイルのフォーマッター",
            "meta description",
          );
          prefix = replaceOnce(
            prefix,
            "HTMLと組み込みCSS・JavaScriptを、単一画面で読みやすく整形します。",
            "構文解析ベースでHTMLと組み込みCSS・JavaScript・JSONを強力に整形します。",
            "brand description",
          );
          prefix = replaceOnce(
            prefix,
            '<span class="local-badge">ブラウザ内だけで処理</span>',
            '<span class="local-badge">Prettier + 寛容フォールバック</span>',
            "engine badge",
          );
          prefix = replaceOnce(
            prefix,
            '<input id="fileInput" class="visually-hidden" type="file" accept=".html,.htm,text/html">',
            '<input id="fileInput" class="visually-hidden" type="file" accept=".html,.htm,.xhtml,.vue,text/html,application/xhtml+xml">',
            "accepted file types",
          );

          const oldSettings = `          <div class="toolbar-group">
            <label class="setting-label" for="indentSelect">
              インデント
              <select id="indentSelect">
                <option value="2" selected>スペース 2</option>
                <option value="4">スペース 4</option>
                <option value="tab">タブ</option>
              </select>
            </label>
            <button id="formatButton" class="primary" type="button">整形</button>
          </div>`;
          const newSettings = `          <div class="toolbar-group formatter-settings">
            <label class="setting-label" for="parserSelect">
              構文
              <select id="parserSelect">
                <option value="auto" selected>自動</option>
                <option value="html">HTML</option>
                <option value="vue">Vue</option>
                <option value="angular">Angular</option>
              </select>
            </label>
            <label class="setting-label" for="indentSelect">
              インデント
              <select id="indentSelect">
                <option value="2" selected>スペース 2</option>
                <option value="4">スペース 4</option>
                <option value="tab">タブ</option>
              </select>
            </label>
            <label class="setting-label" for="widthSelect">
              折返し
              <select id="widthSelect">
                <option value="60">60</option>
                <option value="80" selected>80</option>
                <option value="100">100</option>
                <option value="120">120</option>
              </select>
            </label>
            <label class="setting-label" for="layoutSelect">
              展開
              <select id="layoutSelect">
                <option value="safe" selected>意味を保持</option>
                <option value="maximum">最大</option>
              </select>
            </label>
            <button id="formatButton" class="primary" type="button">強力整形</button>
          </div>`;
          prefix = replaceOnce(prefix, oldSettings, newSettings, "formatter controls");

          const extraCss = `
      .formatter-settings {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .formatter-settings select {
        min-width: 78px;
      }
      #parserSelect {
        min-width: 92px;
      }
      #layoutSelect {
        min-width: 108px;
      }
      button[aria-busy="true"] {
        cursor: progress;
      }
      @media (max-width: 900px) {
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .formatter-settings {
          justify-content: flex-start;
        }
      }
      @media (max-width: 620px) {
        .formatter-settings {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .formatter-settings .setting-label,
        .formatter-settings select {
          width: 100%;
        }
        .formatter-settings button.primary {
          grid-column: 1 / -1;
          width: 100%;
        }
      }
`;
          prefix = replaceOnce(prefix, "    </style>\n  </head>", `${extraCss}    </style>\n  </head>`, "additional styles");

          const packageFiles = [
            "prettier/standalone.js",
            "prettier/plugins/babel.js",
            "prettier/plugins/estree.js",
            "prettier/plugins/html.js",
            "prettier/plugins/postcss.js",
            "prettier/plugins/typescript.js",
            "prettier/plugins/angular.js",
            "js-beautify/js/lib/beautifier.min.js",
          ];

          const engineSources = packageFiles.map((relativePath) => {
            const absolutePath = path.join("node_modules", relativePath);
            if (!fs.existsSync(absolutePath)) {
              throw new Error(`Missing browser engine file: ${absolutePath}`);
            }
            return fs
              .readFileSync(absolutePath, "utf8")
              .replace(/^#!.*\r?\n/u, "")
              .replace(/^\/\/# sourceMappingURL=.*$/gmu, "")
              .trim();
          });
          const engineSource = engineSources.join(";\n");
          const encodedEngine = Buffer.from(engineSource, "utf8").toString("base64");
          const engineChunks = encodedEngine.match(/.{1,4096}/gu) ?? [];

          const prettierLicense = fs.readFileSync("node_modules/prettier/LICENSE", "utf8").trim();
          const beautifierLicense = fs.readFileSync("node_modules/js-beautify/LICENSE", "utf8").trim();
          const licenseComment = [
            "    <!--!",
            "      Embedded dependency: Prettier 3.9.6",
            ...prettierLicense.split(/\r?\n/u).map((line) => `      ${line}`),
            "",
            "      Embedded dependency: js-beautify 2.0.3 (fallback engine)",
            ...beautifierLicense.split(/\r?\n/u).map((line) => `      ${line}`),
            "    -->",
          ].join("\n");

          const payloadScript = [
            '    <script id="formatterEnginePayload" type="application/json">',
            JSON.stringify(engineChunks, null, 2),
            "    </script>",
          ].join("\n");

          const runtimeFactory = String.raw`function createFormatterRuntime(globalScope) {
  "use strict";

  const prettierEngine = globalScope.prettier;
  const pluginContainer = globalScope.prettierPlugins ?? {};
  const prettierPluginList = Array.isArray(pluginContainer)
    ? pluginContainer.filter(Boolean)
    : Object.values(pluginContainer).filter(Boolean);
  const fallbackEngine = globalScope.beautifier ?? {};
  const fallbackHtml = fallbackEngine.html ?? fallbackEngine.html_beautify;
  const fallbackCss = fallbackEngine.css ?? fallbackEngine.css_beautify;
  const fallbackJavaScript = fallbackEngine.js ?? fallbackEngine.js_beautify;

  if (!prettierEngine || typeof prettierEngine.format !== "function") {
    throw new Error("Prettier engine was not loaded.");
  }
  if (prettierPluginList.length < 5) {
    throw new Error("Prettier plugins were not loaded completely.");
  }
  if (
    typeof fallbackHtml !== "function" ||
    typeof fallbackCss !== "function" ||
    typeof fallbackJavaScript !== "function"
  ) {
    throw new Error("Fallback formatter engine was not loaded.");
  }

  function now() {
    return globalScope.performance?.now?.() ?? Date.now();
  }

  function countLines(value) {
    return value ? value.split("\n").length : 0;
  }

  function countOpeningTags(value, tagName) {
    return (value.match(new RegExp(`<${tagName}\\b`, "giu")) ?? []).length;
  }

  function normalizeUserOptions(userOptions = {}) {
    const indentUnit = userOptions.indentUnit ?? "  ";
    const useTabs = indentUnit === "\t";
    const requestedWidth = Number(userOptions.maxLineLength);
    const printWidth = Number.isFinite(requestedWidth)
      ? Math.max(40, Math.min(240, Math.trunc(requestedWidth)))
      : 80;
    const parserMode = ["auto", "html", "vue", "angular", "lwc"].includes(
      userOptions.parserMode,
    )
      ? userOptions.parserMode
      : "auto";
    const layoutMode = userOptions.layoutMode === "maximum" ? "maximum" : "safe";

    return {
      useTabs,
      tabWidth: useTabs ? 2 : Math.max(1, indentUnit.length),
      printWidth,
      parserMode,
      layoutMode,
      endWithNewline: userOptions.endWithNewline !== false,
      fallback: userOptions.fallback !== false,
    };
  }

  function detectHtmlParser(source, parserMode) {
    if (parserMode !== "auto") {
      return parserMode;
    }
    const beginning = source.slice(0, 12000);
    if (
      /<template(?:\s|>)/iu.test(beginning) &&
      /<script(?:\s|>)/iu.test(source) &&
      /<style(?:\s|>)/iu.test(source)
    ) {
      return "vue";
    }
    if (
      /\*ng(?:If|For|Switch)|\[\([\w.-]+\)\]|\([\w.-]+\)\s*=|\[[\w.-]+\]\s*=/u.test(
        beginning,
      )
    ) {
      return "angular";
    }
    return "html";
  }

  function commonPrettierOptions(options) {
    return {
      plugins: prettierPluginList,
      printWidth: options.printWidth,
      tabWidth: options.tabWidth,
      useTabs: options.useTabs,
      endOfLine: "lf",
      embeddedLanguageFormatting: "auto",
      singleAttributePerLine: true,
      bracketSameLine: false,
      proseWrap: "preserve",
      semi: true,
      trailingComma: "all",
      arrowParens: "always",
    };
  }

  function commonFallbackOptions(options) {
    return {
      indent_char: options.useTabs ? "\t" : " ",
      indent_size: options.useTabs ? 1 : options.tabWidth,
      indent_with_tabs: options.useTabs,
      preserve_newlines: false,
      max_preserve_newlines: 0,
      end_with_newline: options.endWithNewline,
      wrap_line_length: options.printWidth,
      eol: "\n",
    };
  }

  function normalizeOutput(output, endWithNewline) {
    const normalized = String(output ?? "").replace(/\r\n?/gu, "\n").replace(/[ \t]+$/gmu, "");
    if (!normalized) {
      return "";
    }
    const withoutTrailingLines = normalized.replace(/\n+$/u, "");
    return endWithNewline ? `${withoutTrailingLines}\n` : withoutTrailingLines;
  }

  function serializeError(error) {
    const message = error instanceof Error ? error.message : String(error);
    const location = error?.loc?.start ?? error?.loc ?? null;
    return {
      name: error?.name ?? "Error",
      message,
      line: Number.isFinite(location?.line) ? location.line : null,
      column: Number.isFinite(location?.column) ? location.column : null,
    };
  }

  function errorSummary(error) {
    const serialized = serializeError(error);
    const location = serialized.line
      ? ` (${serialized.line}:${serialized.column ?? 1})`
      : "";
    return `${serialized.message}${location}`;
  }

  function makeReport({
    source,
    output,
    engine,
    parser,
    fallback,
    warning,
    startedAt,
  }) {
    return {
      engine,
      parser,
      fallback,
      warning: warning ?? null,
      inputLines: countLines(source),
      outputLines: countLines(output),
      inputCharacters: source.length,
      outputCharacters: output.length,
      styleBlocks: countOpeningTags(source, "style"),
      scriptBlocks: countOpeningTags(source, "script"),
      elapsedMilliseconds: Math.max(0, now() - startedAt),
    };
  }

  async function formatHtml(input, userOptions = {}) {
    const source = String(input ?? "");
    const options = normalizeUserOptions(userOptions);
    const parser = detectHtmlParser(source, options.parserMode);
    const startedAt = now();

    if (!source.trim()) {
      return {
        output: "",
        report: makeReport({
          source,
          output: "",
          engine: "prettier",
          parser,
          fallback: false,
          startedAt,
        }),
      };
    }

    try {
      const output = normalizeOutput(
        await prettierEngine.format(source, {
          ...commonPrettierOptions(options),
          parser,
          htmlWhitespaceSensitivity: options.layoutMode === "maximum" ? "ignore" : "css",
          vueIndentScriptAndStyle: true,
        }),
        options.endWithNewline,
      );
      return {
        output,
        report: makeReport({
          source,
          output,
          engine: "prettier",
          parser,
          fallback: false,
          startedAt,
        }),
      };
    } catch (strictError) {
      if (!options.fallback) {
        throw strictError;
      }
      try {
        const fallbackOptions = commonFallbackOptions(options);
        const output = normalizeOutput(
          fallbackHtml(source, {
            ...fallbackOptions,
            indent_inner_html: true,
            indent_head_inner_html: true,
            indent_body_inner_html: true,
            indent_scripts: "normal",
            extra_liners: [],
            wrap_attributes: "force-expand-multiline",
            wrap_attributes_min_attrs: 2,
            wrap_attributes_indent_size: options.tabWidth,
            inline_custom_elements: false,
            unformatted: [],
            content_unformatted: ["pre", "textarea"],
            brace_style: "collapse",
            operator_position: "before-newline",
            break_chained_methods: true,
            templating: ["auto"],
          }),
          options.endWithNewline,
        );
        return {
          output,
          report: makeReport({
            source,
            output,
            engine: "js-beautify",
            parser: "tolerant-html",
            fallback: true,
            warning: errorSummary(strictError),
            startedAt,
          }),
        };
      } catch (fallbackError) {
        throw new Error(
          `厳格解析: ${errorSummary(strictError)} / 寛容整形: ${errorSummary(fallbackError)}`,
        );
      }
    }
  }

  async function formatCss(input, userOptions = {}) {
    const source = String(input ?? "");
    const options = normalizeUserOptions(userOptions);
    const startedAt = now();
    try {
      const output = normalizeOutput(
        await prettierEngine.format(source, {
          ...commonPrettierOptions(options),
          parser: "css",
        }),
        options.endWithNewline,
      );
      return {
        output,
        report: makeReport({
          source,
          output,
          engine: "prettier",
          parser: "css",
          fallback: false,
          startedAt,
        }),
      };
    } catch (strictError) {
      if (!options.fallback) {
        throw strictError;
      }
      const output = normalizeOutput(
        fallbackCss(source, {
          ...commonFallbackOptions(options),
          newline_between_rules: true,
          selector_separator_newline: true,
          space_around_combinator: true,
        }),
        options.endWithNewline,
      );
      return {
        output,
        report: makeReport({
          source,
          output,
          engine: "js-beautify",
          parser: "tolerant-css",
          fallback: true,
          warning: errorSummary(strictError),
          startedAt,
        }),
      };
    }
  }

  async function formatJavaScript(input, userOptions = {}) {
    const source = String(input ?? "");
    const options = normalizeUserOptions(userOptions);
    const parser = userOptions.parser === "typescript" ? "typescript" : "babel";
    const startedAt = now();
    try {
      const output = normalizeOutput(
        await prettierEngine.format(source, {
          ...commonPrettierOptions(options),
          parser,
        }),
        options.endWithNewline,
      );
      return {
        output,
        report: makeReport({
          source,
          output,
          engine: "prettier",
          parser,
          fallback: false,
          startedAt,
        }),
      };
    } catch (strictError) {
      if (!options.fallback) {
        throw strictError;
      }
      const output = normalizeOutput(
        fallbackJavaScript(source, {
          ...commonFallbackOptions(options),
          brace_style: "collapse",
          operator_position: "before-newline",
          break_chained_methods: true,
          space_after_anon_function: false,
          keep_array_indentation: false,
          keep_function_indentation: false,
        }),
        options.endWithNewline,
      );
      return {
        output,
        report: makeReport({
          source,
          output,
          engine: "js-beautify",
          parser: parser === "typescript" ? "tolerant-typescript" : "tolerant-javascript",
          fallback: true,
          warning: errorSummary(strictError),
          startedAt,
        }),
      };
    }
  }

  async function formatJson(input, userOptions = {}) {
    const source = String(input ?? "");
    const options = normalizeUserOptions(userOptions);
    const startedAt = now();
    try {
      const output = normalizeOutput(
        await prettierEngine.format(source, {
          ...commonPrettierOptions(options),
          parser: "json",
        }),
        options.endWithNewline,
      );
      return {
        output,
        report: makeReport({
          source,
          output,
          engine: "prettier",
          parser: "json",
          fallback: false,
          startedAt,
        }),
      };
    } catch (strictError) {
      if (!options.fallback) {
        throw strictError;
      }
      try {
        const parsed = JSON.parse(source);
        const indentation = options.useTabs ? "\t" : " ".repeat(options.tabWidth);
        const output = normalizeOutput(
          JSON.stringify(parsed, null, indentation),
          options.endWithNewline,
        );
        return {
          output,
          report: makeReport({
            source,
            output,
            engine: "json-native",
            parser: "json",
            fallback: true,
            warning: errorSummary(strictError),
            startedAt,
          }),
        };
      } catch (fallbackError) {
        throw new Error(
          `JSON解析: ${errorSummary(strictError)} / 標準JSON解析: ${errorSummary(fallbackError)}`,
        );
      }
    }
  }

  async function execute(kind, input, options) {
    switch (kind) {
      case "html":
        return formatHtml(input, options);
      case "css":
        return formatCss(input, options);
      case "javascript":
        return formatJavaScript(input, options);
      case "typescript":
        return formatJavaScript(input, { ...options, parser: "typescript" });
      case "json":
        return formatJson(input, options);
      default:
        throw new Error(`Unknown formatter kind: ${kind}`);
    }
  }

  return {
    execute,
    capabilities: {
      engines: ["prettier", "js-beautify"],
      parsers: ["html", "vue", "angular", "lwc", "css", "babel", "typescript", "json"],
    },
  };
}`;

          const bootstrapScript = String.raw`    <script>
      (() => {
        "use strict";

        const payloadElement = document.querySelector("#formatterEnginePayload");
        if (!payloadElement) {
          throw new Error("Formatter engine payload was not found.");
        }

        const encodedChunks = JSON.parse(payloadElement.textContent || "[]");
        const binary = atob(encodedChunks.join(""));
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        const engineSource = new TextDecoder().decode(bytes);
        payloadElement.remove();

        const createFormatterRuntime = ${runtimeFactory};
        const workerRuntimeSource = [
          "self.__createFormatterRuntime = ",
          createFormatterRuntime.toString(),
          ";\nconst __runtime = self.__createFormatterRuntime(self);",
          "\nself.postMessage({ type: 'ready', capabilities: __runtime.capabilities });",
          "\nself.onmessage = async (event) => {",
          "\n  const { id, kind, input, options } = event.data || {};",
          "\n  try {",
          "\n    const result = await __runtime.execute(kind, input, options);",
          "\n    self.postMessage({ type: 'result', id, ok: true, output: result.output, report: result.report });",
          "\n  } catch (error) {",
          "\n    self.postMessage({ type: 'result', id, ok: false, error: { name: error?.name || 'Error', message: error?.message || String(error), stack: error?.stack || '' } });",
          "\n  }",
          "\n};",
        ].join("");

        let worker = null;
        let workerObjectUrl = "";
        let workerReady = false;
        let workerFailed = false;
        let workerCapabilities = null;
        let localRuntime = null;
        let requestSequence = 0;
        let lastReport = null;
        const pendingRequests = new Map();
        let resolveWorkerReady;
        let rejectWorkerReady;
        const workerReadyPromise = new Promise((resolve, reject) => {
          resolveWorkerReady = resolve;
          rejectWorkerReady = reject;
        });

        function rejectPending(error) {
          for (const pending of pendingRequests.values()) {
            pending.reject(error);
          }
          pendingRequests.clear();
        }

        function disableWorker(error) {
          if (workerFailed) {
            return;
          }
          workerFailed = true;
          workerReady = false;
          rejectWorkerReady?.(error);
          rejectPending(error);
          worker?.terminate();
          worker = null;
          if (workerObjectUrl) {
            URL.revokeObjectURL(workerObjectUrl);
            workerObjectUrl = "";
          }
        }

        try {
          const blob = new Blob([engineSource, "\n", workerRuntimeSource], {
            type: "text/javascript;charset=utf-8",
          });
          workerObjectUrl = URL.createObjectURL(blob);
          worker = new Worker(workerObjectUrl);
          worker.addEventListener("message", (event) => {
            const message = event.data || {};
            if (message.type === "ready") {
              workerReady = true;
              workerCapabilities = message.capabilities ?? null;
              resolveWorkerReady?.(message.capabilities);
              if (workerObjectUrl) {
                URL.revokeObjectURL(workerObjectUrl);
                workerObjectUrl = "";
              }
              return;
            }
            if (message.type !== "result") {
              return;
            }
            const pending = pendingRequests.get(message.id);
            if (!pending) {
              return;
            }
            pendingRequests.delete(message.id);
            if (message.ok) {
              pending.resolve({
                output: message.output,
                report: { ...message.report, execution: "worker" },
              });
            } else {
              const error = new Error(message.error?.message || "Worker formatting failed.");
              error.name = message.error?.name || "Error";
              error.stack = message.error?.stack || error.stack;
              pending.reject(error);
            }
          });
          worker.addEventListener("error", (event) => {
            disableWorker(event.error || new Error(event.message || "Formatter worker failed."));
          });
        } catch (error) {
          disableWorker(error instanceof Error ? error : new Error(String(error)));
        }

        async function ensureLocalRuntime() {
          if (localRuntime) {
            return localRuntime;
          }
          const script = document.createElement("script");
          script.textContent = engineSource;
          document.head.append(script);
          script.remove();
          localRuntime = createFormatterRuntime(window);
          return localRuntime;
        }

        async function executeLocally(kind, input, options) {
          const runtime = await ensureLocalRuntime();
          const result = await runtime.execute(kind, input, options);
          return {
            output: result.output,
            report: { ...result.report, execution: "main-thread" },
          };
        }

        async function executeInWorker(kind, input, options) {
          if (!worker || workerFailed) {
            throw new Error("Formatter worker is unavailable.");
          }
          if (!workerReady) {
            await Promise.race([
              workerReadyPromise,
              new Promise((_, reject) => {
                window.setTimeout(() => reject(new Error("Formatter worker startup timed out.")), 10000);
              }),
            ]);
          }
          const id = ++requestSequence;
          return new Promise((resolve, reject) => {
            pendingRequests.set(id, { resolve, reject });
            worker.postMessage({ id, kind, input, options });
          });
        }

        async function execute(kind, input, options = {}) {
          let result;
          if (!workerFailed && worker) {
            try {
              result = await executeInWorker(kind, input, options);
            } catch (error) {
              disableWorker(error instanceof Error ? error : new Error(String(error)));
              result = await executeLocally(kind, input, options);
            }
          } else {
            result = await executeLocally(kind, input, options);
          }
          lastReport = Object.freeze({ ...result.report });
          return result.output;
        }

        window.HtmlFormatterCore = Object.freeze({
          formatHtml: (input, options) => execute("html", input, options),
          formatCss: (input, options) => execute("css", input, options),
          formatJavaScript: (input, options) => execute("javascript", input, options),
          formatTypeScript: (input, options) => execute("typescript", input, options),
          formatJson: (input, options) => execute("json", input, options),
          getLastReport: () => (lastReport ? { ...lastReport } : null),
          getCapabilities: () => ({
            worker: Boolean(worker && !workerFailed),
            workerReady,
            engines: workerCapabilities?.engines ?? ["prettier", "js-beautify"],
            parsers: workerCapabilities?.parsers ?? [
              "html",
              "vue",
              "angular",
              "lwc",
              "css",
              "babel",
              "typescript",
              "json",
            ],
          }),
        });
      })();
    </script>`;

