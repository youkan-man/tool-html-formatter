      - name: Create a safely minified one-line copy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const { minify } = require("html-minifier-terser");

          (async () => {
            const source = fs.readFileSync("index.html", "utf8");
            assert.doesNotMatch(source, /<script\b[^>]*\bsrc\s*=/iu);
            assert.match(source, /Prettier 3\.9\.6/u);
            assert.match(source, /new Worker\(/u);
            assert.match(source, /formatTypeScript/u);
            assert.match(source, /formatJson/u);

            const minified = await minify(source, {
              collapseBooleanAttributes: false,
              collapseInlineTagWhitespace: false,
              collapseWhitespace: true,
              conservativeCollapse: false,
              decodeEntities: false,
              keepClosingSlash: true,
              minifyCSS: true,
              minifyJS: true,
              removeAttributeQuotes: false,
              removeComments: true,
              removeOptionalTags: false,
              removeRedundantAttributes: false,
              sortAttributes: false,
              sortClassName: false,
              useShortDoctype: false,
            });
            const oneLine = minified.replace(/\r?\n/gu, "");
            assert.equal(oneLine.split("\n").length, 1);
            assert.ok(oneLine.length > 500000, `One-line app is unexpectedly small: ${oneLine.length}`);
            fs.writeFileSync("/tmp/index.one-line.html", oneLine, "utf8");
            console.log(`[one-line] 1 line / ${oneLine.length.toLocaleString()} characters`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
