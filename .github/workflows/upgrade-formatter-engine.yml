            assert.deepEqual(networkRequests, [], `${label}: external network requests were made.`);
            assert.equal(errors.length, 0, `${label}: ${errors.join("\n")}`);
            await page.close();
            return output;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const originalOutput = await exerciseUi(browser, "original app", originalPath);
              const oneLineOutput = await exerciseUi(browser, "one-line app", oneLinePath);
              assert.equal(oneLineOutput, originalOutput, "One-line app produced different sample output.");

              const { page } = await openApp(browser, "self-format source", originalPath);
              const oneLineSource = fs.readFileSync(oneLinePath, "utf8");
              const selfFormatted = await page.evaluate(
                async (source) => window.HtmlFormatterCore.formatHtml(source, {
                  indentUnit: "  ",
                  maxLineLength: 80,
                  parserMode: "html",
                  layoutMode: "safe",
                  endWithNewline: true,
                  fallback: false,
                }),
                oneLineSource,
              );
              const selfReport = await page.evaluate(() => window.HtmlFormatterCore.getLastReport());
              await page.close();

              const selfFormattedLines = selfFormatted.trimEnd().split("\n").length;
              assert.equal(selfReport.engine, "prettier");
              assert.equal(selfReport.fallback, false);
              assert.equal(selfReport.execution, "worker");
              assert.ok(
                selfFormattedLines > 800,
                `Complete one-line app expanded to only ${selfFormattedLines} lines.`,
              );
              fs.writeFileSync("/tmp/index.self-formatted.html", selfFormatted, "utf8");
              const selfOutput = await exerciseUi(
                browser,
                "self-formatted app",
                "/tmp/index.self-formatted.html",
              );
              assert.equal(selfOutput, originalOutput, "Self-formatted app produced different sample output.");

              console.log("[browser] original application: passed");
              console.log("[browser] one-line application: passed");
              console.log("[browser] self-formatted application: passed");
              console.log("[browser] strict HTML/CSS/JS/TS/JSON parsers: passed");
              console.log("[browser] Vue and Angular parsers: passed");
              console.log("[browser] malformed-input fallback: passed");
              console.log("[browser] input script non-execution: passed");
              console.log(`[browser] complete app expanded from 1 line to ${selfFormattedLines.toLocaleString()} lines`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit the verified formatter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/upgrade-formatter-engine.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: upgrade to parser-based formatter with worker fallback"
          git push origin HEAD:main
