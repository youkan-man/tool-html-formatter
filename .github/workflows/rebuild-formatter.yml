name: Rebuild formatter with embedded beautifier

on:
  push:
    paths:
      - .github/workflows/rebuild-formatter.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build and test tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save \
            js-beautify@2.0.3 \
            html-minifier-terser@7.2.0 \
            playwright@1.55.0

      - name: Replace the shallow formatter engine
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const htmlPath = "index.html";
          const source = fs.readFileSync(htmlPath, "utf8");
          const scriptStart = source.indexOf("    <script>");
          const uiMarker = [
            "      (() => {",
            "        \"use strict\";",
            "        if (!window.HtmlFormatterCore) {",
          ].join("\n");
          const uiStart = source.indexOf(uiMarker, scriptStart);
          const scriptEnd = source.indexOf("    </script>", uiStart);

          if (scriptStart < 0 || uiStart < 0 || scriptEnd < 0) {
            throw new Error("Could not locate the existing formatter and UI scripts.");
          }

          let uiScript = source.slice(uiStart, scriptEnd).trimEnd();
          uiScript = uiScript
            .replace("maxLineLength: 120,", "maxLineLength: 80,")
            .replace(
              "HTML・組み込みCSS・JavaScriptを整形しました",
              "HTML・組み込みCSS・JavaScriptを展開整形しました",
            );

          const bundlePath = "node_modules/js-beautify/js/lib/beautifier.min.js";
          if (!fs.existsSync(bundlePath)) {
            throw new Error(`Browser bundle was not found: ${bundlePath}`);
          }

          const packageJson = JSON.parse(
            fs.readFileSync("node_modules/js-beautify/package.json", "utf8"),
          );
          if (packageJson.version !== "2.0.3") {
            throw new Error(`Unexpected js-beautify version: ${packageJson.version}`);
          }

          const licenseText = fs
            .readFileSync("node_modules/js-beautify/LICENSE", "utf8")
            .trim()
            .split(/\r?\n/)
            .map((line) => ` * ${line}`)
            .join("\n");
          const licenseComment = [
            "/*!",
            " * Embedded js-beautify 2.0.3",
            licenseText,
            " */",
          ].join("\n");

          const bundle = fs
            .readFileSync(bundlePath, "utf8")
            .replace(/\r?\n?\/\/# sourceMappingURL=.*$/u, "")
            .replace(/<\/script/giu, "<\\/script")
            .trim();

          const wrapper = String.raw`      (() => {
            "use strict";

            const engine = window.beautifier ?? {};
            const htmlBeautify = engine.html ?? engine.html_beautify ?? window.html_beautify;
            const cssBeautify = engine.css ?? engine.css_beautify ?? window.css_beautify;
            const jsBeautify = engine.js ?? engine.js_beautify ?? window.js_beautify;

            if (
              typeof htmlBeautify !== "function" ||
              typeof cssBeautify !== "function" ||
              typeof jsBeautify !== "function"
            ) {
              throw new Error("Embedded beautifier engine was not loaded.");
            }

            function buildCommonOptions(userOptions = {}) {
              const indentUnit = userOptions.indentUnit ?? "  ";
              const useTabs = indentUnit === "\t";
              const requestedWidth = Number(userOptions.maxLineLength);
              return {
                indent_char: useTabs ? "\t" : " ",
                indent_size: useTabs ? 1 : Math.max(1, indentUnit.length),
                indent_with_tabs: useTabs,
                preserve_newlines: false,
                max_preserve_newlines: 0,
                end_with_newline: userOptions.endWithNewline !== false,
                wrap_line_length: Number.isFinite(requestedWidth)
                  ? Math.max(60, Math.min(80, requestedWidth))
                  : 80,
                eol: "\n",
              };
            }

            function formatHtml(input, userOptions = {}) {
              const common = buildCommonOptions(userOptions);
              return htmlBeautify(String(input ?? ""), {
                ...common,
                indent_inner_html: true,
                indent_head_inner_html: true,
                indent_body_inner_html: true,
                indent_scripts: "normal",
                extra_liners: [],
                wrap_attributes: "force-expand-multiline",
                wrap_attributes_min_attrs: 2,
                wrap_attributes_indent_size: common.indent_size,
                inline: [
                  "a",
                  "abbr",
                  "b",
                  "bdi",
                  "bdo",
                  "cite",
                  "code",
                  "data",
                  "del",
                  "dfn",
                  "em",
                  "i",
                  "ins",
                  "kbd",
                  "mark",
                  "q",
                  "s",
                  "samp",
                  "small",
                  "strong",
                  "sub",
                  "sup",
                  "time",
                  "u",
                  "var",
                ],
                inline_custom_elements: false,
                unformatted: [],
                content_unformatted: ["pre", "textarea"],
                brace_style: "collapse",
                operator_position: "before-newline",
                break_chained_methods: true,
                space_after_anon_function: false,
              });
            }

            function formatCss(input, userOptions = {}) {
              return cssBeautify(String(input ?? ""), {
                ...buildCommonOptions(userOptions),
                newline_between_rules: true,
                selector_separator_newline: true,
                space_around_combinator: true,
              });
            }

            function formatJavaScript(input, userOptions = {}) {
              return jsBeautify(String(input ?? ""), {
                ...buildCommonOptions(userOptions),
                brace_style: "collapse",
                operator_position: "before-newline",
                break_chained_methods: true,
                space_after_anon_function: false,
                keep_array_indentation: false,
                keep_function_indentation: false,
              });
            }

            window.HtmlFormatterCore = {
              formatHtml,
              formatCss,
              formatJavaScript,
            };
          })();`;

          const replacement = [
            "    <script>",
            licenseComment,
            bundle,
            "    </script>",
            "    <script>",
            wrapper,
            uiScript,
            "    </script>",
          ].join("\n");

          const rebuilt =
            source.slice(0, scriptStart) +
            replacement +
            source.slice(scriptEnd + "    </script>".length);

          if (rebuilt.includes("const VOID_ELEMENTS")) {
            throw new Error("The old shallow formatter engine is still present.");
          }
          if (!rebuilt.includes("Embedded js-beautify 2.0.3")) {
            throw new Error("The embedded formatter engine was not added.");
          }
          if (/<script\b[^>]*\bsrc\s*=/iu.test(rebuilt)) {
            throw new Error("The rebuilt page unexpectedly depends on an external script.");
          }

          fs.writeFileSync(htmlPath, rebuilt, "utf8");
          console.log(`Rebuilt ${htmlPath}: ${Buffer.byteLength(rebuilt)} bytes`);
          NODE

      - name: Verify aggressive formatting and create one-line input
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const beautify = require("js-beautify");
          const { minify } = require("html-minifier-terser");

          const options = {
            indent_char: " ",
            indent_size: 2,
            indent_inner_html: true,
            indent_head_inner_html: true,
            indent_body_inner_html: true,
            indent_scripts: "normal",
            preserve_newlines: false,
            max_preserve_newlines: 0,
            end_with_newline: true,
            wrap_line_length: 80,
            wrap_attributes: "force-expand-multiline",
            wrap_attributes_min_attrs: 2,
            wrap_attributes_indent_size: 2,
            extra_liners: [],
            inline: [
              "a", "abbr", "b", "bdi", "bdo", "cite", "code", "data",
              "del", "dfn", "em", "i", "ins", "kbd", "mark", "q", "s",
              "samp", "small", "strong", "sub", "sup", "time", "u", "var",
            ],
            inline_custom_elements: false,
            unformatted: [],
            content_unformatted: ["pre", "textarea"],
            brace_style: "collapse",
            operator_position: "before-newline",
            break_chained_methods: true,
          };

          const fixture = '<!doctype html><html lang="ja"><head><meta charset="UTF-8"><style>body{margin:0;background:#fff;color:#111}.card,.panel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px}@media(max-width:600px){.card,.panel{grid-template-columns:1fr}}</style></head><body><main id="app" class="card" data-mode="test"><button id="run" class="primary" type="button">Run</button><span>status</span></main><script>const state={count:0,items:[{id:1,label:"alpha",enabled:true},{id:2,label:"beta",enabled:false},{id:3,label:"gamma",enabled:true}],nested:{enabled:true,label:"demo",metadata:{owner:"formatter",version:2}}};document.querySelector("#run").addEventListener("click",()=>{state.count+=1;const normalized=state.items.map((value,index)=>({value,index})).filter((item)=>item.value.enabled);normalized.forEach((item)=>console.log(item));});</script></body></html>';
          const formattedFixture = beautify.html(fixture, options);
          const fixtureLines = formattedFixture.trimEnd().split("\n");
          const scriptMatch = formattedFixture.match(/<script>\s*\n([\s\S]*?)\s*<\/script>/u);
          const scriptLines = scriptMatch ? scriptMatch[1].trim().split("\n") : [];

          assert.ok(fixtureLines.length >= 50, `Fixture was only expanded to ${fixtureLines.length} lines.`);
          assert.match(formattedFixture, /<main\s*\n\s+id="app"\s*\n\s+class="card"/u);
          assert.match(formattedFixture, /<button\s*\n\s+id="run"\s*\n\s+class="primary"/u);
          assert.match(formattedFixture, /<\/button>\s*\n\s*<span>status<\/span>/u);
          assert.match(formattedFixture, /body \{\s*\n\s+margin: 0;/u);
          assert.match(formattedFixture, /\.card,\s*\n\s*\.panel \{/u);
          assert.ok(scriptLines.length >= 15, `Embedded JavaScript was only expanded to ${scriptLines.length} lines.`);
          assert.match(formattedFixture, /const state = \{\s*\n/u);
          assert.match(formattedFixture, /document\.querySelector\("#run"\)\s*\n\s*\.addEventListener/u);

          const source = fs.readFileSync("index.html", "utf8");
          assert.doesNotMatch(source, /<script\b[^>]*\bsrc\s*=/iu);

          (async () => {
            const minified = await minify(source, {
              collapseBooleanAttributes: false,
              collapseInlineTagWhitespace: false,
              collapseWhitespace: true,
              conservativeCollapse: false,
              decodeEntities: false,
              keepClosingSlash: true,
              minifyCSS: true,
              minifyJS: true,
              removeAttributeQuotes: false,
              removeComments: false,
              removeOptionalTags: false,
              removeRedundantAttributes: false,
              sortAttributes: false,
              sortClassName: false,
              useShortDoctype: false,
            });
            const oneLine = minified.replace(/\r?\n/gu, "");
            assert.equal(oneLine.split("\n").length, 1);
            assert.ok(oneLine.length > 50000, "The one-line self-test source is unexpectedly small.");
            fs.writeFileSync("/tmp/index.one-line.html", oneLine, "utf8");

            const reformatted = beautify.html(oneLine, options);
            const lineCount = reformatted.trimEnd().split("\n").length;
            assert.ok(lineCount > 500, `The complete one-line app expanded to only ${lineCount} lines.`);
            assert.match(reformatted, /<style>\s*\n/u);
            assert.match(reformatted, /<script>\s*\n/u);
            fs.writeFileSync("/tmp/index.reformatted.html", reformatted, "utf8");

            console.log(`[self-test] one-line input: 1 line / ${oneLine.length} characters`);
            console.log(`[self-test] formatted output: ${lineCount} lines / ${reformatted.length} characters`);
            console.log(`[self-test] fixture output: ${fixtureLines.length} lines; embedded JS: ${scriptLines.length} lines`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Verify original, one-line, and reformatted applications in Chromium
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const { pathToFileURL } = require("node:url");
          const { chromium } = require("playwright");

          const files = {
            original: path.resolve("index.html"),
            oneLine: "/tmp/index.one-line.html",
            reformatted: "/tmp/index.reformatted.html",
          };

          async function exercise(browser, label, filePath) {
            const page = await browser.newPage();
            const errors = [];
            page.on("pageerror", (error) => errors.push(`pageerror: ${error.stack ?? error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") {
                errors.push(`console: ${message.text()}`);
              }
            });

            await page.goto(pathToFileURL(filePath).href, { waitUntil: "load" });
            await page.locator("#sampleButton").click();
            const input = await page.locator("#sourceInput").inputValue();
            assert.equal(input.split("\n").length, 1, `${label}: sample input was not one line.`);

            await page.locator("#formatButton").click();
            const output = await page.locator("#formattedOutput").inputValue();
            const outputLines = output.trimEnd().split("\n").length;
            const scriptMatch = output.match(/<script>\s*\n([\s\S]*?)\s*<\/script>/u);
            const scriptLines = scriptMatch ? scriptMatch[1].trim().split("\n") : [];

            assert.ok(outputLines >= 35, `${label}: sample expanded to only ${outputLines} lines.`);
            assert.match(output, /<style>\s*\n/u, `${label}: embedded CSS was not expanded.`);
            assert.match(output, /body \{\s*\n\s+margin: 0;/u, `${label}: CSS declarations were not formatted.`);
            assert.match(output, /<script>\s*\n/u, `${label}: embedded JavaScript was not expanded.`);
            assert.ok(scriptLines.length >= 8, `${label}: JavaScript was only expanded to ${scriptLines.length} lines.`);
            assert.match(output, /document\.querySelector\("#button"\)\s*\n\s*\.addEventListener/u, `${label}: JavaScript chains were not expanded.`);
            assert.equal(errors.length, 0, `${label}: ${errors.join("\n")}`);
            assert.equal(await page.locator("#copyButton").isEnabled(), true, `${label}: result actions were not enabled.`);

            await page.close();
            return output;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const originalOutput = await exercise(browser, "original", files.original);
              const oneLineOutput = await exercise(browser, "one-line app", files.oneLine);
              const reformattedOutput = await exercise(browser, "reformatted app", files.reformatted);

              assert.equal(oneLineOutput, originalOutput, "One-line app produced a different formatted sample.");
              assert.equal(reformattedOutput, originalOutput, "Reformatted app produced a different formatted sample.");

              const page = await browser.newPage();
              const minifiedSource = fs.readFileSync(files.oneLine, "utf8");
              await page.goto(pathToFileURL(files.original).href, { waitUntil: "load" });
              const selfFormatted = await page.evaluate((source) => {
                return window.HtmlFormatterCore.formatHtml(source, {
                  indentUnit: "  ",
                  maxLineLength: 80,
                  endWithNewline: true,
                });
              }, minifiedSource);
              await page.close();

              const selfFormattedLines = selfFormatted.trimEnd().split("\n").length;
              assert.ok(
                selfFormattedLines > 500,
                `Browser formatter expanded the complete app to only ${selfFormattedLines} lines.`,
              );
              fs.writeFileSync("/tmp/index.browser-reformatted.html", selfFormatted, "utf8");
              await exercise(browser, "browser-reformatted app", "/tmp/index.browser-reformatted.html");

              console.log("[browser] original app: passed");
              console.log("[browser] one-line minified app: passed");
              console.log("[browser] reformatted app: passed");
              console.log("[browser] browser-reformatted app: passed");
              console.log(`[browser] complete app expanded from 1 line to ${selfFormattedLines} lines`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit the verified single-file formatter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/rebuild-formatter.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: replace shallow formatter with embedded beautifier"
          git push origin HEAD:main
