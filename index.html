<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTMLと組み込みCSS・JavaScriptをブラウザ内だけで整形する単一ファイルのフォーマッター">
    <title>HTML Formatter</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f3f6fa;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --border: #d8e0ea;
        --border-strong: #b8c5d4;
        --text: #172033;
        --text-muted: #5d6b7d;
        --primary: #1267c4;
        --primary-hover: #0d56a5;
        --primary-soft: #e8f2ff;
        --success: #18794e;
        --warning: #9a6700;
        --error: #c93737;
        --focus: #1267c4;
        --shadow: 0 14px 36px rgba(38, 55, 77, 0.09);
        --radius: 12px;
        --control-radius: 7px;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
      }
      button,
      select,
      textarea {
        font: inherit;
      }
      button,
      select {
        min-height: 38px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 14px;
        border: 1px solid var(--border-strong);
        border-radius: var(--control-radius);
        background: var(--surface);
        color: var(--text);
        font-weight: 650;
        cursor: pointer;
        transition: border-color 120ms ease, background-color 120ms ease, color 120ms ease, transform 120ms ease;
      }
      button:hover:not(:disabled) {
        border-color: #8da0b7;
        background: #f7f9fc;
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }
      button:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(18, 103, 196, 0.2);
        outline-offset: 1px;
        border-color: var(--focus);
      }
      button.primary {
        min-width: 108px;
        border-color: var(--primary);
        background: var(--primary);
        color: #ffffff;
      }
      button.primary:hover:not(:disabled) {
        border-color: var(--primary-hover);
        background: var(--primary-hover);
      }
      button.quiet {
        border-color: transparent;
        background: transparent;
        color: var(--text-muted);
      }
      button.quiet:hover:not(:disabled) {
        border-color: var(--border);
        background: var(--surface-muted);
        color: var(--text);
      }
      select {
        padding: 0 34px 0 11px;
        border: 1px solid var(--border-strong);
        border-radius: var(--control-radius);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      .app-shell {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
      }
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 20px clamp(18px, 3vw, 42px);
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .brand h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 1.6rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      .brand p {
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 0.88rem;
      }
      .local-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
        padding: 7px 10px;
        border: 1px solid #bbd7f6;
        border-radius: 999px;
        background: var(--primary-soft);
        color: #0d559c;
        font-size: 0.78rem;
        font-weight: 700;
      }
      .local-badge::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        content: "";
      }
      .app-main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 14px;
        min-height: 0;
        padding: 18px clamp(14px, 2.5vw, 34px);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 4px 16px rgba(38, 55, 77, 0.04);
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .setting-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        font-size: 0.84rem;
        font-weight: 650;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
        min-height: 0;
      }
      .editor-panel {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(420px, 1fr);
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      .editor-panel.is-drop-target {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(18, 103, 196, 0.14), var(--shadow);
      }
      .editor-panel.is-drop-target::after {
        position: absolute;
        inset: 58px 14px 14px;
        z-index: 2;
        display: grid;
        place-items: center;
        border: 2px dashed var(--primary);
        border-radius: 9px;
        background: rgba(232, 242, 255, 0.94);
        color: var(--primary);
        font-weight: 750;
        content: "HTMLファイルをドロップ";
        pointer-events: none;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 54px;
        padding: 9px 12px 9px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-muted);
      }
      .panel-heading {
        display: flex;
        align-items: baseline;
        min-width: 0;
        gap: 10px;
      }
      .panel-heading h2 {
        margin: 0;
        font-size: 0.94rem;
        letter-spacing: 0.01em;
      }
      .panel-stats {
        overflow: hidden;
        color: var(--text-muted);
        font-size: 0.75rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .panel-actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .panel-actions button {
        min-height: 32px;
        padding: 0 10px;
        font-size: 0.78rem;
      }
      .code-editor {
        width: 100%;
        min-height: 0;
        resize: none;
        border: 0;
        border-radius: 0;
        outline: 0;
        background: #fbfcfe;
        color: #192234;
        padding: 18px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.62;
        tab-size: 2;
        white-space: pre;
      }
      .code-editor::placeholder {
        color: #8491a2;
      }
      .code-editor:focus {
        background: #ffffff;
        box-shadow: inset 0 0 0 2px rgba(18, 103, 196, 0.12);
      }
      .code-editor[readonly] {
        background: #f7f9fc;
      }
      .app-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 48px;
        padding: 10px clamp(18px, 3vw, 42px);
        border-top: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        font-size: 0.78rem;
      }
      .status-message {
        min-width: 0;
      }
      .status-message[data-kind="success"] {
        color: var(--success);
      }
      .status-message[data-kind="warning"] {
        color: var(--warning);
      }
      .status-message[data-kind="error"] {
        color: var(--error);
      }
      .shortcut-hint {
        flex: 0 0 auto;
        white-space: nowrap;
      }
      kbd {
        display: inline-flex;
        min-width: 23px;
        min-height: 22px;
        align-items: center;
        justify-content: center;
        padding: 1px 6px;
        border: 1px solid var(--border-strong);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: var(--surface-muted);
        color: var(--text);
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 820px) {
        .app-main {
          min-height: auto;
        }
        .workspace {
          grid-template-columns: 1fr;
        }
        .editor-panel {
          grid-template-rows: auto minmax(360px, 48vh);
        }
      }
      @media (max-width: 620px) {
        .app-header {
          align-items: flex-start;
          padding-block: 16px;
        }
        .brand p {
          max-width: 34ch;
        }
        .local-badge {
          padding-inline: 8px;
          font-size: 0;
        }
        .local-badge::after {
          font-size: 0.72rem;
          content: "ローカル";
        }
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .toolbar-group {
          justify-content: space-between;
        }
        .toolbar-group:first-child button {
          flex: 1 1 auto;
        }
        .setting-label {
          flex: 1 1 auto;
        }
        .setting-label select {
          flex: 1 1 auto;
        }
        button.primary {
          flex: 0 0 106px;
        }
        .app-footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <h1>HTML Formatter</h1>
          <p>HTMLと組み込みCSS・JavaScriptを、単一画面で読みやすく整形します。</p>
        </div>
        <span class="local-badge">ブラウザ内だけで処理</span>
      </header>
      <main class="app-main">
        <section class="toolbar" aria-label="整形操作">
          <div class="toolbar-group">
            <input id="fileInput" class="visually-hidden" type="file" accept=".html,.htm,text/html"><button id="openButton" type="button">ファイルを開く</button><button id="sampleButton" type="button">サンプル</button>
          </div>
          <div class="toolbar-group">
            <label class="setting-label" for="indentSelect">
              インデント
              <select id="indentSelect">
                <option value="2" selected>スペース 2</option>
                <option value="4">スペース 4</option>
                <option value="tab">タブ</option>
              </select>
            </label>
            <button id="formatButton" class="primary" type="button">整形</button>
          </div>
        </section>
        <section class="workspace" aria-label="HTMLエディター">
          <article id="sourcePanel" class="editor-panel">
            <header class="panel-header">
              <div class="panel-heading">
                <h2>入力</h2>
                <span id="inputStats" class="panel-stats">0行 · 0文字</span>
              </div>
              <div class="panel-actions"><button id="clearButton" class="quiet" type="button">消去</button></div>
            </header>
            <label class="visually-hidden" for="sourceInput">整形するHTML</label>
            <textarea id="sourceInput" class="code-editor" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="ここにHTMLを貼り付けるか、HTMLファイルをドロップしてください。"></textarea>
          </article>
          <article class="editor-panel">
            <header class="panel-header">
              <div class="panel-heading">
                <h2>整形結果</h2>
                <span id="outputStats" class="panel-stats">0行 · 0文字</span>
              </div>
              <div class="panel-actions">
                <button id="copyButton" type="button" disabled>コピー</button><button id="downloadButton" type="button" disabled>保存</button>
              </div>
            </header>
            <label class="visually-hidden" for="formattedOutput">整形済みHTML</label>
            <textarea id="formattedOutput" class="code-editor" spellcheck="false" readonly placeholder="整形結果がここに表示されます。"></textarea>
          </article>
        </section>
      </main>
      <footer class="app-footer">
        <span id="statusMessage" class="status-message" data-kind="neutral" aria-live="polite">入力内容はブラウザ内だけで処理されます。</span><span class="shortcut-hint"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd> で整形</span>
      </footer>
    </div>
    <script>
      (() => {
        "use strict";
        const VOID_ELEMENTS = new Set(["area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr",]);
        const RAW_TEXT_ELEMENTS = new Set(["script", "style", "title", "pre", "textarea", "xmp", "iframe", "noembed", "noframes",]);
        const PRESERVE_CONTENT_ELEMENTS = new Set(["title", "pre", "textarea", "xmp", "iframe", "noembed", "noframes",]);
        const INLINE_ELEMENTS = new Set(["a", "abbr", "acronym", "b", "bdi", "bdo", "big", "br", "button", "cite", "code", "data", "del", "dfn", "em", "i", "img", "input", "ins", "kbd", "label", "map", "mark", "meter", "noscript", "object", "output", "picture", "progress", "q", "ruby", "s", "samp", "select", "slot", "small", "span", "strong", "sub", "sup", "text", "textpath", "time", "tspan", "tt", "u", "var", "wbr",]);
        const P_CLOSING_START_TAGS = new Set(["address", "article", "aside", "blockquote", "div", "dl", "fieldset", "footer", "form", "h1", "h2", "h3", "h4", "h5", "h6", "header", "hgroup", "hr", "main", "menu", "nav", "ol", "p", "pre", "section", "table", "ul",]);
        const CSS_SELECTOR_FUNCTIONS = new Set(["any", "has", "host", "host-context", "is", "matches", "not", "nth-child", "nth-last-child", "selector", "slotted", "where",]);
        const RESTRICTED_LINE_BREAK_KEYWORDS = new Set(["return", "throw", "break", "continue", "yield",]);
        const CONTROL_PAREN_KEYWORDS = new Set(["if", "for", "while", "switch", "catch", "with",]);
        const WORD_OPERATORS = new Set(["in", "instanceof", "of", "as", "satisfies",]);
        const PREFIX_KEYWORDS = new Set(["delete", "typeof", "void", "new", "await", "yield",]);
        const JS_KEYWORDS_ALLOW_REGEX = new Set(["return", "throw", "case", "delete", "void", "typeof", "instanceof", "in", "of", "yield", "await", "else", "do", "new",]);
        const JS_KEYWORDS = new Set(["async", "await", "break", "case", "catch", "class", "const", "continue", "debugger", "default", "delete", "do", "else", "export", "extends", "finally", "for", "from", "function", "get", "if", "import", "in", "instanceof", "let", "new", "of", "return", "set", "static", "super", "switch", "this", "throw", "try", "typeof", "var", "void", "while", "with", "yield",]);
        const JS_OPERATORS = [">>>=", "===", "!==", "**=", "&&=", "||=", "??=", ">>>", "<<=", ">>=", "...", "=>", "==", "!=", "<=", ">=", "++", "--", "&&", "||", "??", "?.", "**", "+=", "-=", "*=", "/=", "%=", "&=", "|=", "^=", "<<", ">>", "=", "+", "-", "*", "/", "%", "<", ">", "!", "~", "&", "|", "^", "?",];
        function normalizeNewlines(value) {
          return String(value ?? "").replace(/\r\n?/g, "\n");
        }
        function escapeRegExp(value) {
          return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }
        function repeatIndent(level, indentUnit) {
          return indentUnit.repeat(Math.max(0, level));
        }
        function normalizeTagWhitespace(rawTag) {
          const raw = rawTag.trim();
          let result = "";
          let quote = "";
          let pendingSpace = false;
          for (let index = 0; index < raw.length; index += 1) {
            const char = raw[index];
            if (quote) {
              result += char;
              if (char === quote) {
                quote = "";
              }
              continue;
            }
            if (char === '"' || char === "'") {
              if (pendingSpace && shouldInsertTagSpace(result, char)) {
                result += " ";
              }
              pendingSpace = false;
              quote = char;
              result += char;
              continue;
            }
            if (/\s/.test(char)) {
              pendingSpace = true;
              continue;
            }
            if (char === "=") {
              result = result.trimEnd();
              pendingSpace = false;
              result += char;
              continue;
            }
            if (pendingSpace && shouldInsertTagSpace(result, char)) {
              result += " ";
            }
            pendingSpace = false;
            result += char;
          }
          return result.replace(/\s+>/g, ">");
        }
        function shouldInsertTagSpace(current, nextChar) {
          if (!current) {
            return false;
          }
          if (current.endsWith("<") || current.endsWith("</") || current.endsWith("=")) {
            return false;
          }
          if (nextChar === ">") {
            return false;
          }
          if (nextChar === "/" && /<$/.test(current)) {
            return false;
          }
          return true;
        }
        function findTagEnd(source, startIndex) {
          let quote = "";
          for (let index = startIndex + 1; index < source.length; index += 1) {
            const char = source[index];
            if (quote) {
              if (char === quote) {
                quote = "";
              }
              continue;
            }
            if (char === '"' || char === "'") {
              quote = char;
              continue;
            }
            if (char === ">") {
              return index;
            }
          }
          return -1;
        }
        function parseTagName(rawTag, isClosing = false) {
          const offset = isClosing ? 2 : 1;
          const match = rawTag.slice(offset).match(/^\s*([A-Za-z][\w:.-]*)/);
          return match ? match[1].toLowerCase() : "";
        }
        function isSelfClosingTag(rawTag) {
          const source = rawTag.trim();
          let index = 1;
          while (index < source.length && /\s/.test(source[index])) {
            index += 1;
          } while (index < source.length && /[\w:.-]/.test(source[index])) {
            index += 1;
          }
          let state = "before-attribute";
          let quote = "";
          const isClosingMarker =(markerIndex) => /^\/\s*>$/.test(source.slice(markerIndex));
          while (index < source.length) {
            const char = source[index];
            if (state === "quoted-value") {
              if (char === quote) {
                quote = "";
                state = "after-quoted-value";
              }
              index += 1;
              continue;
            }
            if (state === "unquoted-value") {
              if (char === ">") {
                return false;
              }
              if (/\s/.test(char)) {
                state = "before-attribute";
              }
              index += 1;
              continue;
            }
            if (state === "before-value") {
              if (/\s/.test(char)) {
                index += 1;
                continue;
              }
              if (char === '"' || char === "'") {
                quote = char;
                state = "quoted-value";
                index += 1;
                continue;
              }
              if (char === ">") {
                return false;
              }
              state = "unquoted-value";
              continue;
            }
            if (state === "attribute-name") {
              if (char === "=") {
                state = "before-value";
                index += 1;
                continue;
              }
              if (/\s/.test(char)) {
                state = "after-attribute-name";
                index += 1;
                continue;
              }
              if (char === "/" && isClosingMarker(index)) {
                return true;
              }
              if (char === ">") {
                return false;
              }
              index += 1;
              continue;
            }
            if (state === "after-attribute-name") {
              if (/\s/.test(char)) {
                index += 1;
                continue;
              }
              if (char === "=") {
                state = "before-value";
                index += 1;
                continue;
              }
              if (char === "/" && isClosingMarker(index)) {
                return true;
              }
              if (char === ">") {
                return false;
              }
              state = "attribute-name";
              continue;
            }
            if (state === "after-quoted-value") {
              if (/\s/.test(char)) {
                state = "before-attribute";
                index += 1;
                continue;
              }
              if (char === "/" && isClosingMarker(index)) {
                return true;
              }
              if (char === ">") {
                return false;
              }
              state = "attribute-name";
              continue;
            }
            if (/\s/.test(char)) {
              index += 1;
              continue;
            }
            if (char === "/" && isClosingMarker(index)) {
              return true;
            }
            if (char === ">") {
              return false;
            }
            state = "attribute-name";
          }
          return false;
        }
        function getTagAttribute(rawTag, attributeName) {
          const pattern = new RegExp(`(?:^|\\s)${escapeRegExp(attributeName)}\\s*=\\s*(?:"([^"]*)"|'([^']*)'|([^\\s>]+))`, "i",);
          const inner = rawTag.replace(/^<\/?\s*[\w:.-]+/, "");
          const match = pattern.exec(inner);
          if (!match) {
            return null;
          }
          return match[1] ?? match[2] ?? match[3] ?? "";
        }
        function findRawClosingTag(source, startIndex, tagName) {
          const pattern = new RegExp(`<\\/\\s*${escapeRegExp(tagName)}\\s*>`, "ig");
          pattern.lastIndex = startIndex;
          const match = pattern.exec(source);
          if (!match) {
            return null;
          }
          return {
            start: match.index,
            end: pattern.lastIndex,
            raw: match[0],
          };
        }
        function tokenizeHtml(input) {
          const source = normalizeNewlines(input);
          const tokens = [];
          let index = 0;
          while (index < source.length) {
            if (source.startsWith("<!--", index)) {
              const closingIndex = source.indexOf("-->", index + 4);
              const end = closingIndex === -1 ? source.length : closingIndex + 3;
              tokens.push({
                type: "comment",
                raw: source.slice(index, end)
              });
              index = end;
              continue;
            }
            if (source.startsWith("<![CDATA[", index)) {
              const closingIndex = source.indexOf("]]>", index + 9);
              const end = closingIndex === -1 ? source.length : closingIndex + 3;
              tokens.push({
                type: "declaration",
                raw: source.slice(index, end)
              });
              index = end;
              continue;
            }

            return;
          }
          try {
            const text = await file.text();
            elements.input.value = text;
            elements.output.value = "";
            resetEditorScroll(elements.input);
            resetEditorScroll(elements.output);
            sourceFileName = deriveOutputFileName(file.name);
            updateStats();
            setStatus(`${file.name} を読み込みました。`, "success", true);
            elements.input.focus({
              preventScroll: true
            });
          } catch (error) {
            console.error(error);
            setStatus("ファイルを読み込めませんでした。", "error", true);
          } finally {
            elements.fileInput.value = "";
          }
        }
        function loadSample() {
          const closingScript = "<" + "/script>";
          elements.input.value = ["<!doctype html>", '<html lang="ja"><head><meta charset="UTF-8"><title>Sample</title>', "<style>body{margin:0;font-family:sans-serif;background:#f5f7fb}.card:hover{transform:translateY(-2px)}@media (max-width:600px){.card{margin:12px}}</style>", '</head><body><main><article class="card"><h1>Hello <span>world</span></h1><button id="button">Click</button></article></main>', '<script>const state={count:0,message:`count: ${0}`};document.querySelector("#button").addEventListener("click",()=>{state.count+=1;console.log(/click/i.test("click"),state)});' + closingScript, "</body></html>",].join("");
          elements.output.value = "";
          resetEditorScroll(elements.input);
          resetEditorScroll(elements.output);
          sourceFileName = "sample.formatted.html";
          updateStats();
          setStatus("サンプルHTMLを入力しました。", "neutral", true);
          elements.input.focus({
            preventScroll: true
          });
        }
        function clearEditors() {
          elements.input.value = "";
          elements.output.value = "";
          sourceFileName = "formatted.html";
          updateStats();
          setStatus("入力と整形結果を消去しました。", "neutral", true);
          elements.input.focus();
        }
        function insertIndent(event) {
          if (event.key !== "Tab" || event.altKey || event.ctrlKey || event.metaKey) {
            return;
          }
          event.preventDefault();
          const textarea = event.currentTarget;
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          const indent = getIndentUnit();
          textarea.setRangeText(indent, start, end, "end");
          textarea.dispatchEvent(new Event("input", {
            bubbles: true
          }));
        }
        function setDropActive(active) {
          elements.sourcePanel.classList.toggle("is-drop-target", active);
        }
        elements.formatButton.addEventListener("click", formatDocument);
        elements.copyButton.addEventListener("click", copyOutput);
        elements.downloadButton.addEventListener("click", downloadOutput);
        elements.openButton.addEventListener("click",() => elements.fileInput.click());
        elements.fileInput.addEventListener("change",() => loadFile(elements.fileInput.files?.[0]));
        elements.sampleButton.addEventListener("click", loadSample);
        elements.clearButton.addEventListener("click", clearEditors);
        elements.input.addEventListener("input", updateStats);
        elements.input.addEventListener("keydown", insertIndent);
        elements.output.addEventListener("keydown", insertIndent);
        elements.indentSelect.addEventListener("change",() => {
          try {
            localStorage.setItem("html-formatter-indent", elements.indentSelect.value);
          } catch {}
        });
        for (const eventName of["dragenter", "dragover"]) {
          elements.sourcePanel.addEventListener(eventName,(event) => {
            event.preventDefault();
            setDropActive(true);
          });
        }
        for (const eventName of["dragleave", "drop"]) {
          elements.sourcePanel.addEventListener(eventName,(event) => {
            event.preventDefault();
            setDropActive(false);
          });
        }
        elements.sourcePanel.addEventListener("drop",(event) => {
          loadFile(event.dataTransfer?.files?.[0]);
        });
        document.addEventListener("keydown",(event) => {
          if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
            event.preventDefault();
            formatDocument();
          }
        });
        try {
          const savedIndent = localStorage.getItem("html-formatter-indent");
          if (["2", "4", "tab"].includes(savedIndent ?? "")) {
            elements.indentSelect.value = savedIndent;
          }
        } catch {}updateStats();
        elements.input.focus();
      })();
    </script>
  </body>
</html>
